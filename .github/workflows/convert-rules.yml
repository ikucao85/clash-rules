name: 转换 Shadowrocket → Clash 规则集

on:
  workflow_dispatch:          # 支持手动触发
  schedule:
    - cron: '0 0 * * *'      # 每天 UTC 0 点自动更新
  push:
    branches: [ main, master ]
    paths:
      - 'sr_*.module'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 拉取原始规则（可选）
        run: |
          curl -sL "https://cdn.jsdelivr.net/gh/GMOogway/shadowrocket-rules@master/sr_reject_list.module" -o sr_reject_list.module
          curl -sL "https://cdn.jsdelivr.net/gh/GMOogway/shadowrocket-rules@master/sr_direct_list.module" -o sr_direct_list.module
          curl -sL "https://cdn.jsdelivr.net/gh/GMOogway/shadowrocket-rules@master/sr_proxy_list.module" -o sr_proxy_list.module

      - name: 运行转换脚本
        run: node scripts/convert.js

      - name: 提交规则文件
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          git commit -m "更新 Clash 规则集 $(date +'%Y-%m-%d %H:%M')" || echo "无变更需要提交"
          git push || echo "推送失败或无变更"
