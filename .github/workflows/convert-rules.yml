name: 转换 Shadowrocket → Clash 规则集

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'sr_*.module'
      - 'scripts/**'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.2.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 拉取原始规则
        run: |
          curl -fsSL "https://cdn.jsdelivr.net/gh/GMOogway/shadowrocket-rules@master/sr_reject_list.module" -o sr_reject_list.module
          curl -fsSL "https://cdn.jsdelivr.net/gh/GMOogway/shadowrocket-rules@master/sr_direct_list.module" -o sr_direct_list.module
          curl -fsSL "https://cdn.jsdelivr.net/gh/GMOogway/shadowrocket-rules@master/sr_proxy_list.module" -o sr_proxy_list.module

      - name: 运行转换脚本
        run: node scripts/convert.js

      - name: 强制提交并推送（每次都执行）
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A rules/ sr_*.module
          # 关键：删除无变更判断，允许空提交
          git commit -m "🤖 自动更新规则 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
